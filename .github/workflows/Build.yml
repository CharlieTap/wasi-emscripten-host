name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux:
    name: JVM and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run checks
        run: >-
          ./gradlew
          styleCheck
          :bindings-chasm-wasip1:jvmTest
          :common-util:jvmTest
          :host:jvmTest
          :test-wasi-testsuite:bindings-test:jvmTest
          :wasm-core:jvmTest
          :wasm-wasi-preview1:jvmTest
          :bindings-chasm-wasip1:compileKotlinLinuxX64
          :bindings-chasm-wasip1:compileKotlinLinuxArm64
          --no-configuration-cache

  apple:
    name: Apple targets
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile Apple targets
        run: >-
          ./gradlew
          :bindings-chasm-wasip1:compileKotlinMacosArm64
          :bindings-chasm-wasip1:compileKotlinIosArm64
          :bindings-chasm-wasip1:compileKotlinIosSimulatorArm64
          --no-configuration-cache
